[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "control-freak-batocera"
version = "0.1.0.dev0"
description = "Controller-first settings and management for Batocera"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["pygame-ce>=2.5,<3"]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[project.scripts]
control-freak = "control_freak.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
control_freak = ["assets/fonts/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
